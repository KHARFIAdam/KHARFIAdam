<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="860" height="280">
  <defs>

    <!-- Fond dégradé spatial -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#020818"/>
      <stop offset="50%"  stop-color="#0a0f2e"/>
      <stop offset="100%" stop-color="#060422"/>
    </linearGradient>

    <!-- Halo violet sur la planète principale -->
    <radialGradient id="planetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="40%"  stop-color="#7c3aed" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>

    <!-- Surface planète -->
    <radialGradient id="planetSurface" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#c084fc"/>
      <stop offset="50%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </radialGradient>

    <!-- Petite planète bleue -->
    <radialGradient id="planet2Surface" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#67e8f9"/>
      <stop offset="50%"  stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </radialGradient>

    <!-- Halo bleu -->
    <radialGradient id="planet2Glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <!-- Nébuleuse gauche -->
    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6d28d9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>

    <!-- Nébuleuse droite -->
    <radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0e7490" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow texte -->
    <filter id="textGlow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow doux pour le prénom -->
    <filter id="nameGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow étoile filante -->
    <filter id="starGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5"/>
    </filter>

    <!-- Clip planète (anneau) -->
    <clipPath id="planetClip">
      <circle cx="110" cy="160" r="56"/>
    </clipPath>

    <!-- Clip planète 2 -->
    <clipPath id="planet2Clip">
      <circle cx="760" cy="80" r="30"/>
    </clipPath>

  </defs>

  <!-- ═══════════════════ FOND ═══════════════════ -->
  <rect width="860" height="280" fill="url(#bgGrad)" rx="18"/>

  <!-- ═══════════════════ NÉBULEUSES ═══════════════════ -->
  <ellipse cx="130" cy="160" rx="160" ry="130" fill="url(#nebula1)"/>
  <ellipse cx="750" cy="90"  rx="130" ry="110" fill="url(#nebula2)"/>
  <ellipse cx="430" cy="260" rx="220" ry="60"  fill="#4f46e5" fill-opacity="0.07"/>

  <!-- ═══════════════════ ÉTOILES FIXES ═══════════════════ -->
  <!-- Petites étoiles blanches -->
  <g fill="white">
    <circle cx="30"  cy="20"  r="0.8" opacity="0.7"/>
    <circle cx="80"  cy="12"  r="1.1" opacity="0.9"/>
    <circle cx="155" cy="30"  r="0.7" opacity="0.6"/>
    <circle cx="210" cy="10"  r="0.9" opacity="0.8"/>
    <circle cx="270" cy="22"  r="1.0" opacity="0.7"/>
    <circle cx="340" cy="8"   r="0.8" opacity="0.9"/>
    <circle cx="400" cy="18"  r="1.2" opacity="0.6"/>
    <circle cx="460" cy="5"   r="0.7" opacity="0.8"/>
    <circle cx="520" cy="25"  r="0.9" opacity="0.7"/>
    <circle cx="600" cy="14"  r="1.0" opacity="0.9"/>
    <circle cx="660" cy="6"   r="0.8" opacity="0.6"/>
    <circle cx="720" cy="28"  r="1.1" opacity="0.8"/>
    <circle cx="800" cy="10"  r="0.7" opacity="0.7"/>
    <circle cx="840" cy="22"  r="0.9" opacity="0.9"/>
    <circle cx="50"  cy="50"  r="1.0" opacity="0.5"/>
    <circle cx="310" cy="45"  r="0.8" opacity="0.7"/>
    <circle cx="490" cy="55"  r="1.1" opacity="0.6"/>
    <circle cx="700" cy="50"  r="0.9" opacity="0.8"/>
    <circle cx="820" cy="60"  r="0.7" opacity="0.5"/>
    <circle cx="190" cy="70"  r="1.0" opacity="0.7"/>
    <circle cx="380" cy="65"  r="0.8" opacity="0.9"/>
    <circle cx="580" cy="72"  r="1.1" opacity="0.6"/>
    <circle cx="20"  cy="120" r="0.7" opacity="0.5"/>
    <circle cx="240" cy="110" r="0.9" opacity="0.7"/>
    <circle cx="440" cy="100" r="1.0" opacity="0.6"/>
    <circle cx="640" cy="115" r="0.8" opacity="0.8"/>
    <circle cx="830" cy="105" r="1.1" opacity="0.5"/>
    <circle cx="360" cy="220" r="0.9" opacity="0.5"/>
    <circle cx="500" cy="230" r="0.7" opacity="0.6"/>
    <circle cx="680" cy="215" r="1.0" opacity="0.4"/>
    <circle cx="780" cy="225" r="0.8" opacity="0.6"/>
    <circle cx="60"  cy="245" r="0.7" opacity="0.4"/>
    <circle cx="200" cy="260" r="0.9" opacity="0.5"/>
  </g>

  <!-- Étoiles scintillantes (animation pulse) -->
  <g fill="white">
    <circle cx="75"  cy="35"  r="1.5" opacity="0.0">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0s"    repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="18"  r="1.6" opacity="0.0">
      <animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="0.7s"  repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="40"  r="1.4" opacity="0.0">
      <animate attributeName="opacity" values="0;1;0" dur="2.7s" begin="1.2s"  repeatCount="indefinite"/>
    </circle>
    <circle cx="730" cy="20"  r="1.7" opacity="0.0">
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" begin="0.3s"  repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="240" r="1.5" opacity="0.0">
      <animate attributeName="opacity" values="0;1;0" dur="2.9s" begin="1.8s"  repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="145" r="1.4" opacity="0.0">
      <animate attributeName="opacity" values="0;1;0" dur="4.0s" begin="0.5s"  repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="200" r="1.6" opacity="0.0">
      <animate attributeName="opacity" values="0;1;0" dur="3.3s" begin="2.1s"  repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ═══════════════════ ÉTOILE FILANTE ═══════════════════ -->
  <g opacity="0">
    <line x1="0" y1="0" x2="120" y2="0" stroke="white" stroke-width="1.5"
          stroke-linecap="round" opacity="0.85" filter="url(#starGlow)"/>
    <animateTransform attributeName="transform" type="translate"
      values="-120,50; 960,160" dur="3s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="1s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <line x1="0" y1="0" x2="90" y2="0" stroke="#a5f3fc" stroke-width="1.2"
          stroke-linecap="round" opacity="0.7" filter="url(#starGlow)"/>
    <animateTransform attributeName="transform" type="translate"
      values="-90,100; 960,220" dur="3.8s" begin="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.8s" begin="5s" repeatCount="indefinite"/>
  </g>

  <!-- ═══════════════════ PLANÈTE PRINCIPALE (gauche) ═══════════════════ -->
  <!-- Halo externe -->
  <circle cx="110" cy="160" r="90" fill="url(#planetGlow)" opacity="0.6">
    <animate attributeName="r" values="88;94;88" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.7;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Corps planète -->
  <circle cx="110" cy="160" r="56" fill="url(#planetSurface)"/>

  <!-- Texture surface (bandes) -->
  <g clip-path="url(#planetClip)" opacity="0.25">
    <ellipse cx="110" cy="140" rx="56" ry="12" fill="#e879f9"/>
    <ellipse cx="110" cy="165" rx="56" ry="8"  fill="#c026d3"/>
    <ellipse cx="110" cy="185" rx="56" ry="10" fill="#7c3aed"/>
  </g>

  <!-- Reflet lumineux -->
  <ellipse cx="92" cy="142" rx="20" ry="14" fill="white" opacity="0.12"/>

  <!-- Anneau planétaire -->
  <ellipse cx="110" cy="165" rx="84" ry="20" fill="none"
           stroke="#c084fc" stroke-width="6" stroke-opacity="0.55"/>
  <ellipse cx="110" cy="165" rx="84" ry="20" fill="none"
           stroke="#e9d5ff" stroke-width="2" stroke-opacity="0.35"/>
  <!-- Partie avant de l'anneau (par-dessus la planète) -->
  <path d="M 26,165 A 84,20 0 0,0 194,165" fill="none"
        stroke="#c084fc" stroke-width="6" stroke-opacity="0.7"/>

  <!-- ═══════════════════ PETITE PLANÈTE BLEUE (droite haut) ═══════════════════ -->
  <!-- Orbite décorative -->
  <circle cx="770" cy="90" r="55" fill="none" stroke="#22d3ee" stroke-width="0.6" stroke-opacity="0.2"
          stroke-dasharray="4,6"/>

  <!-- Halo -->
  <circle cx="760" cy="80" r="50" fill="url(#planet2Glow)" opacity="0.5">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Corps planète bleue -->
  <circle cx="760" cy="80" r="30" fill="url(#planet2Surface)"/>

  <!-- Texture surface -->
  <g clip-path="url(#planet2Clip)" opacity="0.2">
    <ellipse cx="760" cy="70" rx="30" ry="6" fill="#a5f3fc"/>
    <ellipse cx="760" cy="85" rx="30" ry="5" fill="#0e7490"/>
  </g>

  <!-- Reflet -->
  <ellipse cx="750" cy="72" rx="11" ry="8" fill="white" opacity="0.18"/>

  <!-- ═══════════════════ SATELLITE EN ORBITE ═══════════════════ -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0 110 160; 360 110 160" dur="12s" repeatCount="indefinite"/>
    <circle cx="110" cy="95" r="5" fill="#fbbf24"/>
    <circle cx="110" cy="95" r="9" fill="#fbbf24" fill-opacity="0.2"/>
  </g>

  <!-- Petit satellite orbite planète bleue -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0 760 80; 360 760 80" dur="7s" repeatCount="indefinite"/>
    <circle cx="760" cy="45" r="3.5" fill="#34d399"/>
    <circle cx="760" cy="45" r="6" fill="#34d399" fill-opacity="0.2"/>
  </g>

  <!-- ═══════════════════ PARTICULES / POUSSIÈRE ═══════════════════ -->
  <g opacity="0.5">
    <circle cx="220" cy="80"  r="1.5" fill="#a78bfa"/>
    <circle cx="235" cy="92"  r="1.0" fill="#c084fc"/>
    <circle cx="215" cy="100" r="1.2" fill="#818cf8"/>
    <circle cx="650" cy="200" r="1.4" fill="#67e8f9"/>
    <circle cx="665" cy="190" r="1.0" fill="#a5f3fc"/>
    <circle cx="645" cy="185" r="1.2" fill="#38bdf8"/>
  </g>

  <!-- ═══════════════════ LIGNE DÉCORATIVE ═══════════════════ -->
  <line x1="195" y1="140" x2="680" y2="140" stroke="url(#bgGrad)"
        stroke-width="0" opacity="0"/>
  <!-- Ligne horizontale lumineuse sous le texte -->
  <line x1="200" y1="188" x2="660" y2="188"
        stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.4"
        stroke-dasharray="6,10"/>

  <!-- ═══════════════════ TEXTE PRINCIPAL ═══════════════════ -->

  <!-- Sous-titre au-dessus -->
  <text x="430" y="112"
        font-family="'Segoe UI', 'Inter', 'Arial', sans-serif"
        font-size="13" font-weight="400" letter-spacing="8"
        fill="#a78bfa" text-anchor="middle" opacity="0.85"
        filter="url(#textGlow)">
✦  DATA ENGINEER  ✦
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Prénom ADAM -->
  <text x="430" y="162"
        font-family="'Segoe UI', 'Inter', 'Arial Black', sans-serif"
        font-size="62" font-weight="900" letter-spacing="14"
        fill="white" text-anchor="middle"
        filter="url(#nameGlow)">
    <tspan fill="url(#nameGradText)">ADAM</tspan>
  </text>

  <!-- Dégradé appliqué au texte via un fill trick -->
  <defs>
    <linearGradient id="nameGradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#e879f9"/>
      <stop offset="40%"  stop-color="#c084fc"/>
      <stop offset="70%"  stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="lastNameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#67e8f9"/>
      <stop offset="50%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
  </defs>

  <!-- Prénom avec dégradé (overlay) -->
  <text x="430" y="162"
        font-family="'Segoe UI', 'Inter', 'Arial Black', sans-serif"
        font-size="62" font-weight="900" letter-spacing="14"
        fill="url(#nameGradText)" text-anchor="middle"
        filter="url(#nameGlow)">
    ADAM
    <animate attributeName="letter-spacing" values="14;16;14" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- NOM KHARFI -->
  <text x="430" y="200"
        font-family="'Segoe UI', 'Inter', 'Arial Black', sans-serif"
        font-size="28" font-weight="700" letter-spacing="20"
        fill="url(#lastNameGrad)" text-anchor="middle"
        filter="url(#textGlow)" opacity="0.95">
    KHARFI
  </text>

  <!-- ═══════════════════ POINTS DÉCORATIFS ═══════════════════ -->
  <!-- Losange gauche du texte -->
  <polygon points="200,152 207,160 200,168 193,160" fill="#a855f7" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite"/>
  </polygon>
  <!-- Losange droit du texte -->
  <polygon points="660,152 667,160 660,168 653,160" fill="#22d3ee" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" begin="1.25s" repeatCount="indefinite"/>
  </polygon>

  <!-- ═══════════════════ BORDURE LUMINEUSE ═══════════════════ -->
  <rect width="860" height="280" fill="none" rx="18"
        stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect width="860" height="280" fill="none" rx="18"
        stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.3"/>

</svg>
